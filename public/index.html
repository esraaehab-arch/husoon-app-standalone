<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Husoon Hifz Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column; a five-segment ring (one segment per fortress) leads, five werd rows follow. */
:root{
  --bg:#eef1ee;
  --surface:#fbfcfa;
  --ink:#10303a;
  --muted:#5d7278;
  --line:#d5dcd8;
  --accent:#1d5c8f;      /* lapis */
  --accent-ink:#ffffff;
  --gold:#a87a1c;        /* completion */
  --gold-soft:#f3e8cc;
  --weak:#b4472f;
  --far:#7fa3c2;
  --display:"Reem Kufi","Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
  --body:"Schibsted Grotesk","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1f26; --surface:#132c35; --ink:#e6eeec; --muted:#93a8ac; --line:#24424c;
    --accent:#6fb0e6; --accent-ink:#08202b; --gold:#e0b558; --gold-soft:#3a3118;
    --weak:#e8846c; --far:#3f6f96; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1f26; --surface:#132c35; --ink:#e6eeec; --muted:#93a8ac; --line:#24424c;
  --accent:#6fb0e6; --accent-ink:#08202b; --gold:#e0b558; --gold-soft:#3a3118;
  --weak:#e8846c; --far:#3f6f96; color-scheme:dark;
}
:root[data-look="day"]{
  --bg:#eef1ee; --surface:#fbfcfa; --ink:#10303a; --muted:#5d7278; --line:#d5dcd8;
  --accent:#1d5c8f; --accent-ink:#ffffff; --gold:#a87a1c; --gold-soft:#f3e8cc;
  --weak:#b4472f; --far:#7fa3c2; color-scheme:light;
}
:root[data-look="night"]{
  --bg:#0c1f26; --surface:#132c35; --ink:#e6eeec; --muted:#93a8ac; --line:#24424c;
  --accent:#6fb0e6; --accent-ink:#08202b; --gold:#e0b558; --gold-soft:#3a3118;
  --weak:#e8846c; --far:#3f6f96; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 16px 96px}
.ar{font-family:var(--display);direction:rtl;unicode-bidi:isolate}

/* header */
.top{display:flex;align-items:center;gap:16px;padding:20px 0 16px}
.top h1{font-family:var(--display);font-size:26px;line-height:1.2;margin:0;font-weight:700}
.top .dates{color:var(--muted);font-size:13px;margin-top:4px}
.ring{flex:none;width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .seg{fill:none;stroke:var(--line);stroke-width:9;stroke-linecap:round;transition:stroke .3s}
.ring .seg.on{stroke:var(--gold)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:22px}
.ring .mid small{font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}

/* werd rows */
.werds{display:flex;flex-direction:column;gap:10px}
.werd{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;border-inline-start:5px solid var(--accent)}
.werd.done{border-inline-start-color:var(--gold)}
.werd .name{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.werd .name .ar{font-size:21px;font-weight:700}
.werd .name .en{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.werd .what{font-size:15px;font-weight:600}
.golink{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--accent);text-align:start;text-decoration:underline;text-underline-offset:3px}
.werd .sub{font-size:13px;color:var(--muted)}
.werd .info{min-width:0}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.gold{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sync{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}

.tick{width:42px;height:42px;border-radius:10px;border:2px solid var(--muted);background:transparent;color:transparent;font-size:22px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.tick.on{background:var(--gold);border-color:var(--gold);color:var(--surface)}
.tick.part{border-color:var(--gold);color:var(--ink);font-size:13px;background:var(--gold-soft)}
.tick:disabled{opacity:.35;cursor:not-allowed}
.tick.show:disabled{opacity:1;cursor:default}
/* week */
.week{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px 10px}
.wrow{display:grid;grid-template-columns:minmax(58px,1.3fr) repeat(5,1fr);gap:6px;align-items:center;padding:6px 4px;border-top:1px solid var(--line)}
.wrow.head{border-top:0;font-size:11px;color:var(--muted);text-align:center;align-items:end}
.wrow.head .ar{display:block;font-size:15px;color:var(--ink);font-weight:700}
.wrow.now{background:var(--gold-soft);border-radius:10px;border-top-color:transparent}
.wrow .dn{font-weight:700;font-size:14px}
.wrow .dn small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.wrow .tick{width:100%;max-width:42px;height:auto;aspect-ratio:1;margin:0 auto}
.wsum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 12px}
.wsum b{font-size:20px}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.wday.now{border-color:var(--gold);border-width:2px}
.wday.later{opacity:.6}
.wday .dh{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin-bottom:8px}
.wday .dh small{font-weight:400;color:var(--muted);font-size:13px}
.wline{display:grid;grid-template-columns:52px repeat(5,1fr);gap:6px;align-items:start;text-align:center;font-size:10.5px;color:var(--muted)}
.wline+.wline{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.wline .rl{text-align:start;font-size:12px;font-weight:600;color:var(--ink);padding-top:9px}
.wline .tick{width:36px;height:36px;margin:0 auto 3px;font-size:19px}
.rsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.rlist{display:flex;flex-direction:column;gap:6px}
.rrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;border-inline-start:5px solid var(--line)}
.rrow.need{border-inline-start-color:var(--accent)}
.rrow.weak{border-inline-start-color:var(--weak)}
.rrow.ok{border-inline-start-color:var(--gold)}
.rrow b{font-size:15px}
.rrow small{display:block;color:var(--muted);font-size:12.5px}
.rrow .tick{width:38px;height:38px}
.flag{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.flag.on{background:var(--weak);border-color:var(--weak);color:var(--surface)}
.gapset{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin:0 0 12px}
.gapset input{width:70px;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;text-align:center}
.addrow{display:flex;gap:8px;margin-bottom:6px}
.addrow input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.rrow.done b{text-decoration:line-through;color:var(--muted)}
.del{border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:600;padding:4px 0;text-decoration:underline}
.tk{min-width:86px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:8px 12px;font-weight:700;font-size:15px;touch-action:manipulation;user-select:none}
.tk small{display:inline;color:inherit;opacity:.85;font-weight:500;font-size:12px}
.tk.full{background:var(--gold-soft);color:var(--ink)}
.tk:active{transform:scale(.96)}
.reader .bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.reader .bar .mid{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.reader .bar input{width:68px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;text-align:center}
.sheet{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:200px}
.sheet canvas{display:block;width:100%;height:auto}
.sheet{touch-action:pan-y;cursor:pointer;user-select:none}
.app.wide{max-width:1180px}
.sheet.two{display:grid;grid-template-columns:1fr 1fr;gap:0}
.sheet.two .half{min-width:0;border-inline-end:1px solid #cfd6d2}
.sheet.two .half:last-child{border-inline-end:0}
.sheet.look-gray canvas{filter:grayscale(1)}
.sheet.look-bw canvas{filter:grayscale(1) contrast(1.7) brightness(1.06)}
.idx{margin-bottom:14px}
.jchips{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-bottom:8px}
.jc{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 0;font-weight:600;font-size:13px}
.ixr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:15px}
.ixr small{color:var(--muted);font-size:12.5px;white-space:nowrap}
.ixr b{color:var(--accent);margin-inline-end:6px}
.ixr .ar{font-size:18px;margin-inline-end:6px}
.ixlist{max-height:340px;overflow:auto;margin-top:8px}
details.ixall summary{cursor:pointer;font-weight:600;color:var(--accent);padding:6px 0}
.blankpg{background:#fff;aspect-ratio:595/842;width:100%}
.sheet .half .note{padding:40px 14px;text-align:center;color:#5d7278}
.vh{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
label.btn{display:inline-block;cursor:pointer}
.pick{display:block;border:2px dashed var(--muted);border-radius:14px;padding:28px 16px;text-align:center;background:var(--surface);cursor:pointer}
.pick b{display:block;font-size:17px;margin-bottom:4px}
.pick span{font-size:13px;color:var(--muted)}
.pick input{display:block;margin:14px auto 0;max-width:100%;font:inherit}
.linkb{border:0;background:none;color:var(--accent);font-weight:600;font-size:12.5px;padding:4px 0;text-decoration:underline;margin-inline-end:12px}
.srcsel{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;font-size:14px}
.srcsel select{flex:1;min-width:0;max-width:300px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.mtype{border-top:1px solid var(--line);padding:12px 0}
.mtype .mh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700;margin-bottom:8px}
.mtype .mh small{font-weight:400;color:var(--muted);font-size:12px}
.slots{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-bottom:10px}
.slots .slot{text-align:center;cursor:pointer;border:1.5px solid var(--muted);background:transparent;border-radius:6px;padding:6px 0;font-size:12px;font-weight:600;color:var(--ink)}
.slots .slot.on{background:var(--gold);border-color:var(--gold);color:var(--surface)}
.mtype .f{border-top:0;padding:4px 0}
/* quarters */
.qhead,.qrow{display:grid;grid-template-columns:44px repeat(4,1fr) 10px repeat(4,1fr);gap:4px;align-items:center}
.qhead{font-size:11px;color:var(--muted);text-align:center;margin-bottom:6px}
.qrow{margin-bottom:5px}
.qrow .tick{width:100%;height:34px;border-radius:7px;font-size:17px;border-width:1.5px}
.qrow .tick.jz{font-size:13px;color:var(--ink);border-color:var(--ink)}
.qrow .tick.jz.on{color:var(--surface);border-color:var(--gold)}
.qrow .tick.weak{border-color:var(--weak);background:var(--weak);color:var(--surface)}
.qrow .tick.cur{border-style:dashed;border-color:var(--accent)}
.salah{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.salah .name{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.salah .name .ar{font-size:21px;font-weight:700}
.salah .name .en{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.salah .five{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center;font-size:12px;color:var(--muted)}
.salah .five .tick{margin:0 auto 4px}
.due{display:inline-block;margin-inline-start:6px;padding:1px 8px;border-radius:999px;background:var(--weak);color:var(--surface);font-size:11px;font-weight:700}
.banner{background:var(--surface);border:1px solid var(--weak);border-inline-start:5px solid var(--weak);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:12px}
.f input[type=time]{width:120px}
.note{font-size:12px;color:var(--muted);margin:8px 0 2px}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center}
nav.tabs div{display:flex;width:100%;max-width:520px}
nav.tabs a{flex:1;text-align:center;padding:14px 1px 16px;text-decoration:none;color:var(--muted);font-weight:600;font-size:12px;border-top:3px solid transparent;margin-top:-1px}
nav.tabs a.on{color:var(--ink);border-top-color:var(--accent)}

/* session */
.back{background:none;border:0;padding:16px 0 8px;color:var(--accent);font-weight:600}
.sess h2{font-family:var(--display);font-size:24px;margin:0 0 2px}
.sess .hint{color:var(--muted);font-size:14px;margin:0 0 16px}
.steps{list-style:none;margin:0 0 20px;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--muted)}
.steps li.cur{border-color:var(--accent);color:var(--ink);font-weight:600}
.steps li.ok{color:var(--ink)}
.steps li.ok .n{color:var(--gold);font-weight:700}
.tapwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.tap{width:210px;height:210px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.tap:active{transform:scale(.97)}
.tap:disabled{background:var(--gold-soft);color:var(--ink);opacity:1}
.tap .big{font-size:54px;font-weight:700;line-height:1}
.tap .of{font-size:15px;opacity:.85;margin-top:6px}
.tap .lbl{font-size:13px;opacity:.85;margin-top:8px;max-width:150px;text-align:center}
.tap svg{position:absolute;inset:-10px;width:230px;height:230px;transform:rotate(-90deg);pointer-events:none}
.tap svg circle{fill:none;stroke-width:6}
.tap svg .tr{stroke:var(--line)}
.tap svg .pr{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .2s}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.now{font-size:17px;font-weight:600;text-align:center;margin:0}

/* mushaf map */
h2.page{font-family:var(--display);font-size:24px;margin:20px 0 4px}
p.lead{color:var(--muted);font-size:14px;margin:0 0 14px}
.seg-ctl{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px;background:var(--surface)}
.seg-ctl button{flex:1;border:0;background:none;padding:9px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.seg-ctl button.on{background:var(--accent);color:var(--accent-ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.juz{display:grid;grid-template-columns:30px 1fr;gap:6px;align-items:start;margin-bottom:5px}
.juz>span{font-size:11px;color:var(--muted);padding-top:2px;text-align:end}
.cells{display:flex;flex-wrap:wrap;gap:3px}
.c{width:15px;height:15px;border-radius:3px;border:0;padding:0;background:var(--line)}
.c.far{background:var(--far)} .c.near{background:var(--accent)} .c.weak{background:var(--weak)} .c.cur{background:var(--gold)}
.tip{position:sticky;bottom:64px;background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 12px;font-size:13px;width:max-content;max-width:100%;margin:10px auto 0}

/* plan */
fieldset{border:1px solid var(--line);background:var(--surface);border-radius:14px;margin:0 0 12px;padding:6px 14px 10px}
legend{font-weight:700;font-size:14px;padding:0 6px}
.f{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.f:first-of-type{border-top:0}
.f label{font-size:14px}
.f label small{display:block;color:var(--muted);font-size:12px}
.f input,.f select{width:92px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;text-align:center}
.f select{width:150px;text-align:start}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:380px){.tap{width:180px;height:180px}.tap svg{width:200px;height:200px}.ring{width:76px;height:76px}}
</style>
</head>
<body>
<div class="app" id="app"></div><input id="rd-file" type="file" accept="application/pdf,.pdf" class="vh"><input id="mt-file" type="file" accept="application/pdf,.pdf" multiple class="vh"><input id="fp-file" type="file" accept="application/pdf,.pdf" class="vh">
<nav class="tabs" aria-label="Sections"><div>
  <a href="#today" id="tab-today">Today</a>
  <a href="#week" id="tab-week">Week</a>
  <a href="#revise" id="tab-revise">Revise</a>
  <a href="#mushaf" id="tab-mushaf">Map</a>
  <a href="#reader" id="tab-reader">Mushaf</a>
  <a href="#plan" id="tab-plan">Settings</a>
</div></nav>

<script src="firebase-config.js"></script>
<script src="firebase-shim.js"></script>
<script>
(function(){
"use strict";
var TOTAL=604;
var JUZ=[1,22,42,62,82,102,121,142,162,182,201,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582];
var LS="husoon-hifz-v1";
var STEPS=[
  {k:"listen",t:"Listen to the page",h:"Play the page from your reciter and follow in the mushaf. Tap after each full listen."},
  {k:"silent",t:"Read silently",h:"Read the page with your eyes only. Tap after each read."},
  {k:"aloud",t:"Read aloud",h:"Read the page out loud, looking at the mushaf. Tap after each read."},
  {k:"ayah",t:"Repeat each ayah",h:"Take one ayah at a time and repeat it from memory. Tap after each repetition."},
  {k:"page",t:"Recite the whole page",h:"Join the ayat and recite the full page from memory. Tap after each recitation."}
];

function fresh(){return {v:1,ts:0,
  plan:{start:1,dir:1,perDay:1,read:20,listen:10,near:20,far:20,gap:14,tekrar:20,pdfOffset:0,mushaf:"",view:"auto",look:"color",theme:"auto",rem:{read:"",listen:"",mem:"",near:"",far:""},reps:{listen:5,silent:5,aloud:5,ayah:10,page:20}},
  pages:{},days:{},rev:[],readerPage:1,readPos:1,listenPos:1,farPos:0,session:null};}
function adopt(d){var s=fresh();if(!d||typeof d!=="object")return s;
  for(var k in s)if(d[k]!==undefined&&d[k]!==null||k==="session")s[k]=d[k]===undefined?s[k]:d[k];

      row+='<button class="tick'+(on?" on":"")+cls+'"'+attr+' aria-label="'+w[2]+" "+dt.toLocaleDateString("en-GB",{weekday:"long"})+(on?", done":", not done")+'">'+txt+"</button>";});
    rows+=row+"</div>";});
  var h='<h2 class="page">This week</h2><div class="wsum"><p class="lead" style="margin:0">'+days[0].getDate()+" "+days[0].toLocaleDateString("en-GB",{month:"short"})+" to "+days[6].getDate()+" "+days[6].toLocaleDateString("en-GB",{month:"short"})+". Tick a square when a werd is done. You can fill in earlier days too.</p><span><b>"+done+"</b>/"+cells+"</span></div>";
  h+='<div class="week"><div class="wrow head"><span></span>'+AW.map(function(w){return '<span><span class="ar" lang="ar">'+w[1]+"</span>"+w[2]+"</span>";}).join("")+"</div>"+rows+"</div>";
  h+='<p class="sync">The memorizing square fills by itself when you finish the day’s new pages. Tap today’s to open the session.</p>';
  return h;}

function fld(id,label,small,val,min,max){return '<div class="f"><label for="'+id+'">'+label+(small?"<small>"+small+"</small>":"")+'</label><input id="'+id+'" type="number" inputmode="numeric" min="'+min+'" max="'+max+'" value="'+val+'"></div>';}
function viewPlan(){var p=state.plan,r=p.reps;
  var rm=p.rem||{};
  function tf(k,label){return '<div class="f"><label for="t-'+k+'">'+label+'</label><input id="t-'+k+'" type="time" value="'+esc(rm[k]||"")+'"></div>';}
  var h='<h2 class="page">Settings</h2><p class="lead">These settings drive the Today screen. Changes apply straight away.</p>';
  h+='<fieldset><legend>Theme</legend><div class="seg-ctl" role="group" aria-label="Theme" style="margin:8px 0 4px">'+[["auto","Automatic"],["day","Day"],["night","Night"]].map(function(m){return '<button data-theme-set="'+m[0]+'" class="'+((p.theme||"auto")===m[0]?"on":"")+'">'+m[1]+"</button>";}).join("")+"</div></fieldset>";
  h+="<fieldset><legend>Reminders</legend>"+tf("read","Reading werd")+tf("listen","Listening werd")+tf("mem","Memorizing werd")+tf("near","Revising qareeb")+tf("far","Revising ba3eed")+'<p class="note">Set a time for each werd, or leave it empty for none. While this page is open, a werd that passes its time without a tick is marked Due on Today. This page cannot ring or send a notification when it is closed.</p></fieldset>';
  h+='<fieldset><legend>Already memorized</legend><div class="f"><label for="m-juz">Full juz you know<small>0 to 30</small></label><input id="m-juz" type="number" inputmode="numeric" min="0" max="30" value="0"></div><div class="f"><label for="m-pages">Extra pages after those<small>0 to 22</small></label><input id="m-pages" type="number" inputmode="numeric" min="0" max="22" value="0"></div><div class="f"><label for="m-from">Counted from</label><select id="m-from"><option value="1">Al-Fatihah (juz 1 up)</option><option value="-1">An-Nas (juz 30 down)</option></select></div><div class="f"><span class="note" style="margin:0">'+(memMsg?esc(memMsg):"You have "+memList().length+" of 604 pages marked. This adds to them and moves your next new page to where you stopped.")+'</span><button class="btn" data-act="applymem">Apply</button></div></fieldset>';
  h+="<fieldset><legend>Memorizing</legend>"+fld("p-perDay","New pages per day","",p.perDay,1,20)+fld("p-start","Start from page","1 to 604",p.start,1,604)+'<div class="f"><label for="p-dir">Direction</label><select id="p-dir"><option value="1"'+(p.dir===1?" selected":"")+'>Forward (1 → 604)</option><option value="-1"'+(p.dir===-1?" selected":"")+">Backward (604 → 1)</option></select></div></fieldset>";
  h+="<fieldset><legend>Repetitions for each new page</legend>"+fld("r-listen","Listening","",r.listen,1,99)+fld("r-silent","Reading silently","",r.silent,1,99)+fld("r-aloud","Reading aloud","",r.aloud,1,99)+fld("r-ayah","Each ayah","",r.ayah,1,99)+fld("r-page","Whole page","minimum 20",r.page,20,200)+"</fieldset>";
  h+="<fieldset><legend>Daily awrad</legend>"+fld("p-read","Reading werd, pages","20 pages is one juz",p.read,1,604)+fld("p-listen","Listening werd, pages","10 pages is one hizb",p.listen,1,604)+fld("p-near","Qareeb window, pages","your most recent pages, revised daily",p.near,1,604)+fld("p-far","Ba3eed werd, pages","older pages per day, in rotation",p.far,1,604)+"</fieldset>";
  h+=accountHtml();
  if(assetsNS&&dbNS&&isAdmin)h+=manageHtml();
  return h;}
function accountHtml(){var h='<fieldset><legend>Account</legend>';
  if(!(window.husoonAuth&&husoonAuth.configured))h+='<p class="note">Sign-in is not set up yet. Progress is saved on this device only.</p>';
  else if(acct)h+='<div class="f"><span>Signed in as '+esc(acct.name||acct.email)+'<small style="display:block;color:var(--muted);font-size:12px">'+esc(acct.email)+'</small></span><button class="btn ghost" data-signout="1">Sign out</button></div>';
  else h+='<div class="f"><span class="note" style="margin:0">Sign in to save your progress to your account and use it on all your devices.</span><button class="btn" data-signin="1">Sign in with Google</button></div>';
  if(authMsg)h+='<p class="note" role="status">'+esc(authMsg)+'</p>';
  if(acct&&!isAdmin)h+='<p class="note">Account id: <code style="user-select:all">'+esc(acct.uid||"")+'</code></p>';
  h+='<details style="margin:6px 0"'+(impMsg?" open":"")+'><summary class="note" style="cursor:pointer">Bring progress from the old app</summary><p class="note">In the old app, open Settings, tap Copy my progress, then paste it here. This replaces the progress on this page.</p><textarea id="imp-text" rows="3" style="width:100%;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px"></textarea><div class="f" style="border:0"><span class="note" style="margin:0">'+esc(impMsg)+'</span><button class="btn ghost" data-import="1">Import</button></div></details>';
  return h+'</fieldset>';}

function route(){var h=(location.hash||"#today").slice(1);return ["today","week","revise","mushaf","reader","plan","memorize"].indexOf(h)<0?"today":h;}
function render(){applyTheme();var r=route(),app=document.getElementById("app");
  app.innerHTML=r==="memorize"?viewSession():r==="week"?viewWeek():r==="revise"?viewRevise():r==="reader"?viewReader():r==="mushaf"?viewMushaf():r==="plan"?viewPlan():viewToday();
  ["today","week","revise","mushaf","reader","plan"].forEach(function(t){document.getElementById("tab-"+t).className=(r===t||(r==="memorize"&&t==="today"))?"on":"";});
  app.className="app"+(r==="reader"&&isTwo()?" wide":"");
  if(r==="reader")drawPage();}

/* ---------- actions ---------- */
function toggle(key,posKey,n,d){
  if(d[key]){d[key]=0;state[posKey]=wrap(state[posKey]-n);}else{d[key]=1;state[posKey]=wrap(state[posKey]+n);}}
function act(a,dk){var d=dk?(state.days[dk]||(state.days[dk]={})):day(),s=state.session,rp=state.plan.reps;
  if(a==="read")toggle("read","readPos",state.plan.read,d);
  else if(a==="listen")toggle("listen","listenPos",state.plan.listen,d);
  else if(a==="near"){var rk=dk||dkey();
    if(d.near){d.near=0;unmarkRev(d.nearList||[],rk);delete d.nearList;}
    else{var nl=nearList();if(!nl.length)return;d.near=1;d.nearList=nl;markRev(nl,rk);}}
  else if(a==="far"){var all=farAll().length;
    if(d.far){d.far=0;unmarkRev(d.farList||[],dk||dkey());if(all)state.farPos=((state.farPos-(d.farList||[]).length)%all+all)%all;delete d.farList;}
    else{var l=farToday();if(!l.length)return;d.far=1;d.farList=l;markRev(l,dk||dkey());if(all)state.farPos=(state.farPos+l.length)%all;}}
  else if(a==="start"){if(!s){var p=nextNew();if(p===null)return;state.session={page:p,step:0,c:[0,0,0,0,0],ayah:1,ayahs:0};}
    save();location.hash="memorize";render();return;}
  else if(a==="leave"){location.hash="today";return;}
  else if(a==="applymem"){
    var nj=Math.max(0,Math.min(30,parseInt(document.getElementById("m-juz").value,10)||0));
    var nx2=Math.max(0,Math.min(22,parseInt(document.getElementById("m-pages").value,10)||0));
    var fr=document.getElementById("m-from").value==="-1"?-1:1,cnt=0,busy=s?s.page:null,list=[];
    if(fr===1){var end=(nj>=30?TOTAL:JUZ[nj]-1)+nx2;for(var p1=1;p1<=Math.min(TOTAL,end);p1++)list.push(p1);}
    else{var st0=(nj<=0?TOTAL+1:JUZ[30-nj])-nx2;for(var p2=TOTAL;p2>=Math.max(1,st0);p2--)list.push(p2);}
    if(!list.length){memMsg="Enter at least one juz or one page first.";render();return;}
    list.forEach(function(p){if(!state.pages[p]&&p!==busy){state.pages[p]={d:null,t:p};cnt++;}});
    state.plan.dir=fr;state.plan.start=fr===1?wrap(list[list.length-1]+1):wrap(list[list.length-1]-1);
    var nn=nextNew();
    memMsg=cnt+" pages added. "+memList().length+" of 604 are now marked"+(nn===null?".":", and your next new page is "+nn+".");}
  else if(s&&a==="tap"){var k=STEPS[s.step].k;s.c[s.step]++;
    if(k!=="ayah"&&k!=="page"&&s.c[s.step]>=rp[k])s.step++;}
  else if(s&&a==="undo"){if(s.c[s.step]>0)s.c[s.step]--;}
  else if(s&&a==="nextayah"){s.ayah++;s.ayahs=(s.ayahs||0)+1;s.c[3]=0;}
  else if(s&&a==="lastayah"){s.ayahs=(s.ayahs||0)+1;s.step=4;}
  else if(s&&a==="finish"){d=day();state.pages[s.page]={d:dkey(),t:Date.now(),r:dkey()};d.mem=(d.mem||0)+1;state.session=null;save();location.hash="today";render();return;}
  save();render();}

document.addEventListener("click",function(e){
  if(e.target.closest("[data-signin]")){authMsg="Opening Google sign-in…";render();husoonAuth.signIn().then(function(){location.reload();}).catch(function(er){authMsg="Sign-in did not finish"+(er&&er.code?" ("+er.code+")":"")+". Try again.";render();});return;}
  if(e.target.closest("[data-signout]")){husoonAuth.signOut().then(function(){location.reload();});return;}
  if(e.target.closest("[data-import]")){var it=document.getElementById("imp-text"),txt=it?it.value.trim():"";
    try{var o=JSON.parse(txt);if(!o||typeof o!=="object"||!o.plan||!o.pages)throw 0;state=adopt(o);save();impMsg="Progress imported: "+memList().length+" pages memorized.";}
    catch(er){impMsg="That text is not progress copied from the old app.";}
    render();return;}
  var b=e.target.closest("[data-act]");if(b&&!b.disabled){act(b.getAttribute("data-act"),b.getAttribute("data-day"));return;}
  var sb=e.target.closest("[data-salah]");if(sb&&!sb.disabled){var sk=sb.getAttribute("data-day"),sd=state.days[sk]||(state.days[sk]={});
    sd.s=sd.s||{};var sx=sb.getAttribute("data-salah");if(sd.s[sx])delete sd.s[sx];else sd.s[sx]=1;save();render();return;}
  if(e.target.closest("[data-revadd]")){revAdd();return;}
  if(e.target.closest("[data-ixgo]")){ixGo();return;}
  var rdl=e.target.closest("[data-read]");if(rdl){goReader(+rdl.getAttribute("data-read"),!!rdl.closest("#ix-res"));return;}
  var rdn=e.target.closest("[data-rd]");if(rdn&&!rdn.disabled){turn(+rdn.getAttribute("data-rd"));return;}
  var vwb=e.target.closest("[data-view]");if(vwb){state.plan.view=vwb.getAttribute("data-view");save();render();return;}
  var lkb=e.target.closest("[data-look]");if(lkb){state.plan.look=lkb.getAttribute("data-look");save();render();return;}
  if(e.target.closest("[data-rdclose]")){pdfDoc=null;pdfName="";pdfMsg="";render();return;}
  if(e.target.closest("[data-rdpick]")){var rf=document.getElementById("rd-file");if(rf)rf.value="";return;}
  if(e.target.closest("[data-fullpick]")){if(uploading){upMsg="An upload is still running. Wait for it to finish, or reload the page to cancel it.";render();return;}
    var fpf=document.getElementById("fp-file");if(fpf){fpf.value="";try{if(fpf.showPicker)fpf.showPicker();else fpf.click();}catch(er){fpf.click();}}return;}
  var sl=e.target.closest("[data-slot],[data-slotmany]");if(sl){if(uploading){e.preventDefault();upMsg="An upload is still running. Wait for it to finish, or reload the page to cancel it.";render();return;}
    if(sl.hasAttribute("data-slot")){var sp=sl.getAttribute("data-slot").split("|");pendType=sp[0];pendJuz=+sp[1];}else{pendType=sl.getAttribute("data-slotmany");pendJuz=0;}
    var fi=document.getElementById("mt-file");if(fi)fi.value="";return;}
  if(e.target.closest("[data-mtadd]")){var ne=document.getElementById("mt-name"),nm=ne?ne.value.trim():"";
    if(!nm){upMsg="Type a name for the Mushaf type first.";render();return;}
    upMsg="";var ly=document.getElementById("mt-layout"),lo=ly&&LAYOUTS[ly.value],nd={name:nm,created:Date.now(),files:{},off:0};if(lo){nd.starts=lo.starts;nd.gaps=lo.gaps;}dbNS.collection("mushafs").doc().set(nd).catch(function(){upMsg="The type could not be added. Try again.";render();});return;}
  var md=e.target.closest("[data-mtdel]");if(md){var mid=md.getAttribute("data-mtdel"),mt=typeById(mid);if(!mt||uploading)return;
    if(delArm!==mid){delArm=mid;render();return;}
    delArm="";var ids=Object.keys(mt.files).map(function(k){return mt.files[k];});if(mt.full)ids.push(mt.full);
    dbNS.doc("mushafs/"+mid).delete().then(function(){ids.forEach(function(i){assetsNS.delete(i).catch(function(){});});upMsg=mt.name+" removed.";render();}).catch(function(){upMsg="That type could not be removed. Try again.";render();});return;}
  var tp=e.target.closest("[data-revtap]");if(tp){var tpn=+tp.getAttribute("data-revtap");
    state.rev.forEach(function(x){if(x.p===tpn){x.c=(x.c||0)+1;if(x.c>=state.plan.tekrar)x.done=1;}});revMsg="";save();render();return;}
  var rv=e.target.closest("[data-revtick],[data-revdel]");if(rv){var del=rv.hasAttribute("data-revdel"),rp1=+rv.getAttribute(del?"data-revdel":"data-revtick");
    if(del)state.rev=state.rev.filter(function(x){return x.p!==rp1;});
    else state.rev.forEach(function(x){if(x.p===rp1){if(x.done){x.done=0;x.c=0;}else x.done=1;}});
    revMsg="";save();render();return;}
  var wk=e.target.closest("[data-week]");if(wk){weekTab=wk.getAttribute("data-week");render();return;}
  var th=e.target.closest("[data-theme-set]");if(th){state.plan.theme=th.getAttribute("data-theme-set");save();render();return;}
  var m=e.target.closest("[data-mode]");if(m){markMode=m.getAttribute("data-mode");tipText="";render();return;}
  var c=e.target.closest("[data-q],[data-juz]");if(c){var list,name;
    if(c.hasAttribute("data-juz")){var jz=+c.getAttribute("data-juz");list=jPages(jz);name="Juz "+(jz+1);}
    else{var qq=c.getAttribute("data-q").split("-");list=qPages(+qq[0],+qq[1]);name="Juz "+(+qq[0]+1)+" quarter "+(+qq[1]+1)+" (pages "+ranges(list)+")";}
    var k=cover(list),busy=state.session?state.session.page:null;
    if(markMode==="mem"){
      if(k.m===k.n){list.forEach(function(p){delete state.pages[p];});tipText=name+" cleared";}
      else{list.forEach(function(p){if(!state.pages[p]&&p!==busy)state.pages[p]={d:null,t:p};});tipText=name+" ticked as memorized";}}
    else{
      if(!k.m)tipText=name+" is not memorized yet";
      else{var on=!k.w;list.forEach(function(p){if(state.pages[p])state.pages[p].w=on?1:0;});tipText=name+(on?" flagged weak. It joins qareeb every day.":" is no longer weak");}}
    save();render();}
});
document.addEventListener("change",function(e){var id=e.target.id||"";
  if(id==="rd-file"){openPdf(e.target.files&&e.target.files[0]);return;}
  if(id==="fp-file"||id==="fp-file2"){var ff=e.target.files&&e.target.files[0];if(!ff)return;
    var fn=document.getElementById("fp-name"),fo=document.getElementById("fp-off");fpName=fn?fn.value.trim():"";fpOff=Math.max(0,Math.min(60,parseInt(fo&&fo.value,10)||0));
    if(uploading){upMsg="An upload is still running. Wait for it to finish, or reload the page to cancel it.";render();return;}
    if(!assetsNS||!dbNS){upMsg="Storage is not ready yet. Wait a moment and choose the file again.";render();return;}
    addFullPdf(ff);return;}
  if(id==="mt-file"){if(e.target.files&&e.target.files.length)uploadFiles(Array.prototype.slice.call(e.target.files));return;}
  if(id==="rd-src"){state.plan.mushaf=e.target.value;save();render();return;}
  if(/^mo-/.test(id)){var ov=Math.max(0,Math.min(60,parseInt(e.target.value,10)||0));if(dbNS)dbNS.doc("mushafs/"+id.slice(3)).update({off:ov}).catch(function(){});return;}
  if(id==="rd-page"){goReader(parseInt(e.target.value,10));return;}
  if(/^t-/.test(id)){state.plan.rem=state.plan.rem||{};state.plan.rem[id.slice(2)]=/^\d\d:\d\d$/.test(e.target.value)?e.target.value:"";save();return;}
  if(!/^[pr]-/.test(id))return;
  var k=id.slice(2),v=parseInt(e.target.value,10);if(isNaN(v))return;
  var lo=+e.target.min||-1,hi=+e.target.max||604;if(id!=="p-dir")v=Math.max(lo,Math.min(hi,v));
  if(id.charAt(0)==="r")state.plan.reps[k]=v;else state.plan[k]=v;
  save();render();});
var swX=null,swY=0;
document.addEventListener("pointerdown",function(e){if(e.target.closest(".sheet")){swX=e.clientX;swY=e.clientY;}else swX=null;});
document.addEventListener("pointerup",function(e){if(swX===null)return;var dx=e.clientX-swX,dy=e.clientY-swY,sh=e.target.closest(".sheet")||document.querySelector(".sheet");swX=null;if(!sh)return;
  var p=state.readerPage||1,step=0;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.5)step=dx>0?1:-1;
  else if(Math.abs(dx)<8&&Math.abs(dy)<8){var r=sh.getBoundingClientRect();step=e.clientX<r.left+r.width/2?1:-1;}
  if(step)turn(step);});
var rzT=null;window.addEventListener("resize",function(){clearTimeout(rzT);rzT=setTimeout(function(){var ae=document.activeElement;if(route()==="reader"&&!(ae&&/^(INPUT|SELECT)$/.test(ae.tagName)))render();},200);});
document.addEventListener("pointercancel",function(){swX=null;});
document.addEventListener("input",function(e){if(e.target.id==="ix-q"){var r=document.getElementById("ix-res");if(r)r.innerHTML=ixResults(e.target.value);}});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="ix-q"){e.preventDefault();ixGo();}});
document.addEventListener("keydown",function(e){
  if(route()==="reader"&&(e.key==="ArrowLeft"||e.key==="ArrowRight")&&!/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)){e.preventDefault();turn(e.key==="ArrowLeft"?1:-1);return;}if(e.key==="Enter"&&e.target.id==="rv-page"){e.preventDefault();revAdd();}});
window.addEventListener("hashchange",function(){tipText="";memMsg="";revMsg="";render();window.scrollTo(0,0);});

render();
connect();
setInterval(function(){if(route()==="today")render();},60000);
})();
